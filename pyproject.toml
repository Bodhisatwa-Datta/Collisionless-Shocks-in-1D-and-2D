[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "collisionless-shock-pic"
version = "0.2.0"
description = "Readable PIC experiments for collisionless shocks in 1D and 2D"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Bodhisatwa Datta" },
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
speed = ["numba>=0.57"]
dev = ["matplotlib>=3.7", "numba>=0.57"]

[tool.setuptools]
packages = ["pic", "runs", "visualizations"]
